<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mesanger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card glass">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-title">Mesanger</div>
          <div class="brand-sub">Чаты, группы, звонки</div>
        </div>
      </div>

      <div class="segmented">
        <button id="tabLogin" class="seg active">Вход</button>
        <button id="tabRegister" class="seg">Регистрация</button>
      </div>

      <div class="field">
        <label>Логин</label>
        <input id="authLogin" placeholder="Логин" autocomplete="username" />
      </div>

      <div class="field" id="displayNameWrap" style="display:none;">
        <label>Имя в профиле</label>
        <input id="authDisplayName" placeholder="Никнейм" autocomplete="nickname" />
      </div>

      <div class="field">
        <label>Пароль</label>
        <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button id="authMainBtn" class="primary-btn">Войти</button>
      <button id="authAltBtn" class="ghost-btn">Создать аккаунт</button>
      <div id="authError" class="error-text"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="rail glass">
      <button class="rail-btn active" data-tab="chats">💬</button>
      <button class="rail-btn" data-tab="find">🔎</button>
      <button class="rail-btn" data-tab="groups">👥</button>
      <button class="rail-btn" data-tab="settings">⚙️</button>
      <div class="rail-spacer"></div>
      <button id="logoutBtn" class="rail-btn danger">↩</button>
    </aside>

    <aside class="list-panel glass">
      <div class="panel-top">
        <div>
          <div id="meName" class="panel-title">Профиль</div>
          <div id="meInfo" class="panel-sub">—</div>
        </div>
      </div>

      <div id="tabChats" class="tab-view active">
        <div class="section-head">Чаты</div>
        <div id="chatList" class="list"></div>
      </div>

      <div id="tabFind" class="tab-view">
        <div class="section-head">Найти друзей</div>
        <div class="inline">
          <input id="findInput" placeholder="Логин или ID" />
          <button id="findBtn" class="small-btn">Найти</button>
        </div>
        <div id="findResults" class="list"></div>
      </div>

      <div id="tabGroups" class="tab-view">
        <div class="section-head">Группы</div>
        <div class="inline">
          <input id="groupNameInput" placeholder="Название группы" />
          <button id="createGroupBtn" class="small-btn">Создать</button>
        </div>
        <div class="section-mini">Ваши группы</div>
        <div id="groupList" class="list"></div>
        <div class="section-mini">Пригласить в текущую группу</div>
        <div class="inline">
          <input id="inviteInput" placeholder="Логин или ID" />
          <button id="inviteBtn" class="small-btn">Добавить</button>
        </div>
      </div>

      <div id="tabSettings" class="tab-view">
        <div class="section-head">Настройки</div>
        <div class="field compact">
          <label>Имя профиля</label>
          <input id="setDisplayName" />
        </div>
        <div class="field compact">
          <label>Акцент</label>
          <select id="setAccent">
            <option value="indigo">Indigo</option>
            <option value="pink">Pink</option>
            <option value="cyan">Cyan</option>
            <option value="lime">Lime</option>
            <option value="orange">Orange</option>
          </select>
        </div>
        <div class="field compact">
          <label>Тема</label>
          <select id="setTheme">
            <option value="midnight">Midnight</option>
            <option value="dark">Dark</option>
            <option value="ocean">Ocean</option>
            <option value="violet">Violet</option>
            <option value="light">Light</option>
          </select>
        </div>
        <label class="toggle">
          <input id="setCompact" type="checkbox" />
          <span>Компактный режим</span>
        </label>
        <button id="saveSettingsBtn" class="primary-btn full">Сохранить</button>
      </div>
    </aside>

    <main class="chat-panel glass">
      <header class="chat-top">
        <div>
          <div id="chatTitle" class="chat-title">Выбери чат</div>
          <div id="chatSub" class="chat-sub">Слева открой диалог, группу или поиск друзей</div>
        </div>
        <div class="chat-actions">
          <button id="voiceCallBtn" class="action-btn">🎙 Аудиосвязь</button>
          <button id="videoCallBtn" class="action-btn">📹 Видеосвязь</button>
        </div>
      </header>

      <section id="callStage" class="call-stage hidden">
        <div class="call-head">
          <div>
            <div class="call-title">Звонок</div>
            <div id="callSub" class="call-sub">Ожидание соединения</div>
          </div>
        </div>

        <div class="call-grid">
          <div class="video-card">
            <div class="video-label" id="localLabel">Ты</div>
            <video id="localVideo" autoplay muted playsinline></video>
          </div>

          <div id="remoteVideos" class="remote-grid"></div>
        </div>

        <div class="call-controls">
          <button id="hangupBtn" class="action-btn danger">❌ Отклонить / Завершить</button>
          <button id="screenBtn" class="action-btn">🖥 Показать / скрыть демку</button>
          <button id="cameraBtn" class="action-btn">📷 Камера</button>
          <button id="micBtn" class="action-btn">🎤 Микрофон</button>
        </div>
      </section>

      <section id="messages" class="messages"></section>

      <footer class="composer">
        <textarea id="messageInput" rows="1" placeholder="Написать сообщение..."></textarea>
        <button id="sendBtn" class="send-btn">Отправить</button>
      </footer>
    </main>
  </div>

  <div id="incomingCallModal" class="modal hidden">
    <div class="modal-card glass">
      <div class="modal-title">Входящий звонок</div>
      <div id="incomingCallText" class="modal-text">—</div>
      <div class="modal-actions">
        <button id="acceptCallBtn" class="primary-btn">Принять</button>
        <button id="rejectCallBtn" class="ghost-btn">Отклонить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
